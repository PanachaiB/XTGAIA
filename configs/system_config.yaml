# =====================================================================
# XTGAIA Centralized System Configuration
# =====================================================================

system:
  pipeline_name: "XTGAIA-Engine"
  environment: "development" # development | test | production
  random_seed: 42

# ---------------------------------------------------------------------
# Stage 2: Dual-Timescale Security Knowledge Graph (Algorithm 1)
# ---------------------------------------------------------------------
graph_streaming:
  # In-memory sliding window TTL (50 ms threshold to prevent memory bloat)
  sliding_window_threshold_ms: 50.0
  # Latent state vector dimensions recovered from Neo4j on reconnection
  latent_state_dim: 128
  latent_state_byte_size: 512 # 128 float32 values * 4 bytes

# ---------------------------------------------------------------------
# Stage 3: Continuous-Time Temporal Graph Network (TGN)
# ---------------------------------------------------------------------
tgn_model:
  node_feature_dim: 32
  edge_feature_dim: 16
  memory_dim: 128
  time_dim: 32
  num_attention_heads: 8
  dropout: 0.1
  batch_size: 200
  learning_rate: 0.0001
  max_inference_budget_ms: 15.0

# ---------------------------------------------------------------------
# Stage 4: Topology-Aware Attack-Reachability Risk Engine (Algorithm 2)
# ---------------------------------------------------------------------
risk_engine:
  # Edge exploitability friction weights: 0.50*S_vuln + 0.30*S_priv + 0.20*S_port
  friction_weights:
    w_vuln: 0.50
    w_priv: 0.30
    w_port: 0.20

  # MITRE Privilege Tiers: S_priv
  privilege_tiers:
    admin: 1.0
    local_service: 0.6
    standard_user: 0.2

  # Designated Crown Jewel Assets (Target set C) and Criticality Weights
  crown_jewels:
    "10.0.0.1": 10.0 # Domain Controller / Active Directory
    "10.0.0.5": 8.0  # Core Customer Database / ERP
    "10.0.0.9": 6.0  # Critical CI/CD Pipeline Server

# ---------------------------------------------------------------------
# Stage 5: Double DQN Autonomous Response Decision (Algorithm 3)
# ---------------------------------------------------------------------
double_dqn:
  state_dimension: 16
  action_dimension: 5
  action_space_labels:
    0: "NoOp"
    1: "RateLimit_Throttling"
    2: "Port_Protocol_Isolation"
    3: "Session_Token_Revocation"
    4: "Complete_Host_Quarantine"
  # Linear decomposed reward weights: 1.0*R_contain - 0.5*R_disrupt - 0.1*R_cost
  reward_weights:
    containment: 1.0
    disruption: 0.5
    cost: 0.1
  # Hyperparameters for PettingZoo training
  gamma: 0.99
  epsilon_start: 1.0
  epsilon_min: 0.05
  epsilon_decay: 0.995
  learning_rate: 0.0005
  buffer_capacity: 50000
  target_update_frequency: 1000 # steps

# ---------------------------------------------------------------------
# Stage 6: Multi-Tiered XAI Core Budget & Parameters
# ---------------------------------------------------------------------
xai_engine:
  max_total_xai_budget_ms: 50.0 # Strict sub-50 ms operational budget
  structural:
    num_hops: 2x`
    epochs_mask_optimization: 20
  temporal:
    rollout_identity_blend: 0.5 # 0.5*A^(l) + 0.5*I

# ---------------------------------------------------------------------
# Stage 7: Closed-Loop SOAR & Governance Feedback (Algorithm 4)
# ---------------------------------------------------------------------
closed_loop_feedback:
  analyst_inspection_window_sec: 300 # 5 minutes before auto-commit
  # Penalty injected into Replay Buffer upon human analyst false-positive rollback
  analyst_rollback_penalty: -100.0